name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organization repos need a free license: set GITLEAKS_LICENSE as a repo secret.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  test:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Install locked server dependencies
        working-directory: server
        run: npm ci --ignore-scripts
      - name: Audit server dependencies
        working-directory: server
        run: npm audit --audit-level=moderate
      - name: API authorization and rate limit tests (offline)
        working-directory: server
        run: npm test

  dependency-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install verified OSV-Scanner 2.7.0
        run: python3 ci/install_osv.py "$RUNNER_TEMP/osv-scanner"
      - name: Verify vulnerability gate and scan the entire server lockfile
        run: python3 ci/check_dependencies.py --scanner "$RUNNER_TEMP/osv-scanner" --report osv-results.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: dependency-scan-${{ github.sha }}
          path: osv-results.json
          if-no-files-found: warn
          retention-days: 7

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Pin build package manager
        run: npm install --global npm@11.6.2 --ignore-scripts
      - name: Validate build scripts and release policy
        run: python3 -m unittest discover -s ci -p 'test_*.py' -v
      - name: Build source archive, dependency SBOM and provenance
        run: python3 ci/build_release.py --output dist
      - name: Verify generated file digests
        run: cd dist && sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-evidence-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  signed-build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: [secret-scan, test, dependency-scan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require merged finding #10 in this exact master revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/signing_policy.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Pin build package manager
        run: npm install --global npm@11.6.2 --ignore-scripts
      - name: Rebuild evidence from the guarded commit
        run: python3 ci/build_release.py --output dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign the manifest with ephemeral GitHub OIDC identity
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Verify signature identity and every signed digest
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/master
        run: |
          cosign verify-blob --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/SHA256SUMS
          cd dist
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: signed-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
