<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProofChain Dashboard — Live Audit Trail</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500&family=Manrope:wght@400;500;600;700&display=swap');

  :root {
    --bg: #080808;
    --surface: #111111;
    --surface-raised: #1A1A1A;
    --border: #262220;
    --border-active: #3A342A;
    --gold: #C4A44A;
    --gold-dim: #8B7340;
    --gold-bright: #D4B85C;
    --text: #EDE8E0;
    --text-muted: #7A7268;
    --text-dim: #4A4440;
    --green: #5A8A5A;
    --green-bg: rgba(90,138,90,0.08);
    --red: #8B3030;
    --red-text: #D47070;
    --mono: 'DM Mono', monospace;
    --sans: 'Manrope', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { background: var(--bg); color: var(--text); font-family: var(--sans); }

  body { max-width: 1200px; margin: 0 auto; padding: 2rem; }

  /* ── HEADER ── */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.5rem 0; border-bottom: 1px solid var(--border); margin-bottom: 2rem;
  }
  .header-logo { font-family: var(--mono); font-size: 1rem; color: var(--gold); letter-spacing: 0.05em; text-decoration: none; }
  .header-status { display: flex; gap: 1rem; align-items: center; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .status-dot.offline { background: var(--red); }
  .header-status span { font-size: 0.75rem; color: var(--text-muted); font-family: var(--mono); }

  /* ── AGENT CARD ── */
  .agent-card {
    background: var(--surface); border: 1px solid var(--border);
    padding: 2rem; margin-bottom: 2rem; display: grid;
    grid-template-columns: auto 1fr auto; gap: 1.5rem; align-items: center;
  }
  .agent-avatar {
    width: 64px; height: 64px; border-radius: 2px; background: var(--surface-raised);
    border: 1px solid var(--gold-dim); display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 1.5rem; color: var(--gold);
  }
  .agent-info h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem; }
  .agent-info .wallet { font-family: var(--mono); font-size: 0.75rem; color: var(--text-dim); }
  .agent-info .verified { font-size: 0.75rem; color: var(--green); margin-top: 0.25rem; }
  .agent-meta { text-align: right; }
  .agent-meta .badge {
    display: inline-block; font-family: var(--mono); font-size: 0.625rem;
    padding: 0.25rem 0.75rem; border: 1px solid var(--gold-dim); color: var(--gold);
    text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem;
  }
  .agent-meta .nft { font-family: var(--mono); font-size: 0.625rem; color: var(--text-dim); display: block; }
  .agent-meta a { color: var(--gold-dim); text-decoration: none; font-size: 0.6875rem; }
  .agent-meta a:hover { color: var(--gold); }

  /* ── STATS ROW ── */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
    background: var(--border); border: 1px solid var(--border); margin-bottom: 2rem;
  }
  .stat {
    background: var(--surface); padding: 1.5rem; text-align: center;
  }
  .stat-num { font-family: var(--mono); font-size: 1.75rem; color: var(--gold); display: block; }
  .stat-label { font-size: 0.6875rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.25rem; }

  /* ── SECTION ── */
  .section { margin-bottom: 2rem; }
  .section-title {
    font-family: var(--mono); font-size: 0.6875rem; color: var(--gold-dim);
    text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 1rem;
  }

  /* ── AUDIT TABLE ── */
  .audit-table {
    width: 100%; border-collapse: collapse;
    border: 1px solid var(--border);
  }
  .audit-table th {
    text-align: left; padding: 0.75rem 1rem;
    font-family: var(--mono); font-size: 0.625rem; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.1em; font-weight: 500;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .audit-table td {
    padding: 0.75rem 1rem; font-size: 0.8125rem;
    border-bottom: 1px solid var(--border); vertical-align: top;
  }
  .audit-table tr:hover td { background: rgba(196,164,74,0.03); }
  .audit-table .type-badge {
    display: inline-block; font-family: var(--mono); font-size: 0.5625rem;
    padding: 0.15rem 0.5rem; border: 1px solid var(--border-active); color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .audit-table .type-badge.soul { border-color: var(--gold-dim); color: var(--gold); }
  .audit-table .sig { font-family: var(--mono); font-size: 0.625rem; color: var(--text-dim); }
  .audit-table .sig a { color: var(--text-dim); text-decoration: none; }
  .audit-table .sig a:hover { color: var(--gold-dim); }
  .audit-table .hash { font-family: var(--mono); font-size: 0.5625rem; color: var(--text-dim); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .audit-table .seq { font-family: var(--mono); font-size: 0.625rem; color: var(--gold); }

  /* ── COMPLIANCE GRID ── */
  .compliance-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem;
  }
  .compliance-card {
    background: var(--surface); border: 1px solid var(--border); padding: 1.5rem;
  }
  .compliance-card h3 { font-size: 0.875rem; font-weight: 600; margin-bottom: 0.75rem; }
  .compliance-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
  .compliance-item:last-child { border-bottom: none; }
  .compliance-item .label { font-size: 0.75rem; color: var(--text-muted); }
  .compliance-item .value { font-size: 0.75rem; font-weight: 500; text-align: right; max-width: 55%; }
  .compliance-item .value.compliant { color: var(--green); }
  .compliance-item .value.partial { color: var(--gold); }
  .compliance-item .value.noncompliant { color: var(--red-text); }

  /* ── LOADING ── */
  .loading { text-align: center; padding: 4rem; color: var(--text-muted); font-family: var(--mono); font-size: 0.8125rem; }
  .error { text-align: center; padding: 2rem; color: var(--red-text); background: rgba(139,48,48,0.05); border: 1px solid var(--red); }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .agent-card { grid-template-columns: 1fr; text-align: center; }
    .agent-meta { text-align: center; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .compliance-grid { grid-template-columns: 1fr; }
    .audit-table { font-size: 0.6875rem; }
  }
</style>
</head>
<body>

<div class="header">
  <a href="../Landing%20Page.html" class="header-logo"><img src="../assets/logo.png" alt="ProofChain" style="height:24px;width:auto;vertical-align:middle;margin-right:0.25rem;">ProofChain</a>
  <div class="header-status">
    <span id="api-status">API: checking...</span>
    <div class="status-dot" id="status-dot"></div>
  </div>
</div>

<!-- AGENT CARD -->
<div class="agent-card" id="agent-card">
  <div class="loading">Loading agent identity...</div>
</div>

<!-- STATS -->
<div class="stats" id="stats-row">
  <div class="stat"><span class="stat-num">—</span><span class="stat-label">Audit Records</span></div>
  <div class="stat"><span class="stat-num">—</span><span class="stat-label">Record Types</span></div>
  <div class="stat"><span class="stat-num">—</span><span class="stat-label">Latest Seq</span></div>
  <div class="stat"><span class="stat-num">—</span><span class="stat-label">AgentID NFT</span></div>
</div>

<!-- AUDIT TRAIL -->
<div class="section">
  <div class="section-title">Audit Trail — Latest 25 Records</div>
  <div id="audit-container"><div class="loading">Loading audit trail...</div></div>
</div>

<!-- COMPLIANCE -->
<div class="section">
  <div class="section-title">Compliance Status</div>
  <div id="compliance-container"><div class="loading">Loading compliance report...</div></div>
</div>

<script>
const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? 'http://localhost:3456'
  : '';  // production: relative URLs via nginx proxy
const WALLET = 'FKwU1im523MSGnuJG6YLHEZu4rUGj3xqxHJ6ipQMBG9B';

async function loadAll() {
  try {
    // Health check
    const health = await fetch(`${API}/api/health`).then(r => r.json());
    document.getElementById('api-status').textContent = `API: slot ${health.x1?.slot?.toLocaleString() || '?'}`;
    document.getElementById('status-dot').className = 'status-dot';
  } catch {
    document.getElementById('api-status').textContent = 'API: offline';
    document.getElementById('status-dot').className = 'status-dot offline';
  }

  // Agent identity
  try {
    const agent = await fetch(`${API}/api/agent/${WALLET}`).then(r => r.json());
    renderAgent(agent);
  } catch(e) {
    document.getElementById('agent-card').innerHTML = `<div class="error">Agent lookup failed: ${e.message}</div>`;
  }

  // Audit trail
  try {
    const audit = await fetch(`${API}/api/audit/${WALLET}?limit=25`).then(r => r.json());
    renderAudit(audit);
  } catch(e) {
    document.getElementById('audit-container').innerHTML = `<div class="error">Audit trail load failed: ${e.message}</div>`;
  }

  // Compliance
  try {
    const report = await fetch(`${API}/api/compliance/${WALLET}/report?framework=all`).then(r => r.json());
    renderCompliance(report);
  } catch(e) {
    document.getElementById('compliance-container').innerHTML = `<div class="error">Compliance report failed: ${e.message}</div>`;
  }
}

function renderAgent(agent) {
  const card = document.getElementById('agent-card');
  const name = agent.agent?.name || 'Unknown Agent';
  const desc = agent.agent?.description || '';
  const verified = agent.verified;
  const nft = agent.nft?.mint || agent.agent?.nftMint || '—';
  const registered = agent.agent?.registeredAt
    ? new Date(agent.agent.registeredAt).toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'})
    : '—';
  const explorerUrl = agent.nft?.explorerUrl || `https://explorer.x1.xyz/address/${nft}`;

  card.innerHTML = `
    <div class="agent-avatar">${name[0]}</div>
    <div class="agent-info">
      <h2>${escapeHtml(name)}</h2>
      <div class="wallet">${WALLET.slice(0,8)}...${WALLET.slice(-4)}</div>
      <div class="verified">${verified ? '✓ AgentID Verified — Soulbound' : '✗ Not Verified'}</div>
      <div style="font-size:0.75rem;color:var(--text-dim);margin-top:0.25rem">${escapeHtml(desc)} · Registered ${registered}</div>
    </div>
    <div class="agent-meta">
      <span class="badge">AgentID v2</span>
      <span class="nft">NFT: ${nft.slice(0,8)}...${nft.slice(-4)}</span>
      <a href="${explorerUrl}" target="_blank">View on Explorer →</a>
    </div>
  `;
}

function renderAudit(audit) {
  // Update stats
  const stats = document.querySelectorAll('.stat-num');
  stats[0].textContent = audit.total;
  stats[1].textContent = audit.records.length > 0
    ? [...new Set(audit.records.map(r => r.type.split('.')[0]))].length
    : '—';
  stats[2].textContent = audit.records.find(r => r.seq)?.seq || '—';
  stats[3].textContent = 'Verified';

  if (!audit.records.length) {
    document.getElementById('audit-container').innerHTML = '<div class="loading">No audit records found on chain.</div>';
    return;
  }

  const rows = audit.records.map(r => {
    const sigShort = r.signature.slice(0,8) + '...' + r.signature.slice(-4);
    const explorerLink = `https://explorer.x1.xyz/tx/${r.signature}`;
    const time = r.timestamp
      ? new Date(r.timestamp).toLocaleString('en-US', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})
      : '—';
    const typeClass = r.type.startsWith('soul') ? 'soul' : '';

    return `
      <tr>
        <td><span class="type-badge ${typeClass}">${escapeHtml(r.type)}</span></td>
        <td>${time}</td>
        <td>${r.seq ? `<span class="seq">#${r.seq}</span>` : '—'}</td>
        <td><span class="hash">${r.hash || '—'}</span></td>
        <td class="sig"><a href="${explorerLink}" target="_blank">${sigShort}</a></td>
      </tr>
    `;
  }).join('');

  document.getElementById('audit-container').innerHTML = `
    <table class="audit-table">
      <thead>
        <tr><th>Type</th><th>Time</th><th>Seq</th><th>Hash</th><th>TX</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function renderCompliance(report) {
  if (!report.reports) {
    document.getElementById('compliance-container').innerHTML = '<div class="loading">No compliance data available.</div>';
    return;
  }

  const frameworks = report.reports;
  let html = '<div class="compliance-grid">';

  for (const [key, fw] of Object.entries(frameworks)) {
    const title = key === 'eu_ai_act' ? 'EU AI Act' : key === 'soc2' ? 'SOC 2 Type II' : 'GDPR';
    let items = '';

    if (fw.trust_services_criteria) {
      // SOC 2
      for (const [tsc, status] of Object.entries(fw.trust_services_criteria)) {
        const cls = status.startsWith('COMPLIANT') ? 'compliant'
          : status.startsWith('TO BE') ? 'partial' : 'noncompliant';
        items += `<div class="compliance-item"><span class="label">${tsc.replace(/_/g,' ')}</span><span class="value ${cls}">${escapeHtml(status)}</span></div>`;
      }
    } else {
      // EU AI Act / GDPR
      for (const [k, v] of Object.entries(fw)) {
        if (k === 'framework') continue;
        const label = k.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
        const cls = typeof v === 'string' && v.startsWith('COMPLIANT') ? 'compliant'
          : typeof v === 'string' && v.startsWith('NON') ? 'noncompliant'
          : typeof v === 'string' && (v.startsWith('PARTIAL') || v.startsWith('READY') || v.startsWith('TO BE')) ? 'partial' : '';
        items += `<div class="compliance-item"><span class="label">${label}</span><span class="value ${cls}">${typeof v === 'string' ? escapeHtml(v) : JSON.stringify(v)}</span></div>`;
      }
    }

    html += `<div class="compliance-card"><h3>${title}</h3>${items}</div>`;
  }

  html += '</div>';
  document.getElementById('compliance-container').innerHTML = html;
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadAll();
</script>
</body>
</html>
